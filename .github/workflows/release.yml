name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验三个版本并白名单暂存双宿主文件
        run: node scripts/release.mjs stage "$GITHUB_REF_NAME" "$RUNNER_TEMP/agent-kanban-stage"

      - name: 构建双宿主 ZIP（保留隐藏清单）
        run: |
          (cd "$RUNNER_TEMP/agent-kanban-stage/kimi" && zip -q -r "$GITHUB_WORKSPACE/kanban-plugin.zip" .)
          (cd "$RUNNER_TEMP/agent-kanban-stage/codex" && zip -q -r "$GITHUB_WORKSPACE/kanban-codex-plugin.zip" .)

      - name: 上传前解包并校验完整性
        run: |
          mkdir -p "$RUNNER_TEMP/agent-kanban-unpacked/kimi" "$RUNNER_TEMP/agent-kanban-unpacked/codex"
          unzip -q kanban-plugin.zip -d "$RUNNER_TEMP/agent-kanban-unpacked/kimi"
          unzip -q kanban-codex-plugin.zip -d "$RUNNER_TEMP/agent-kanban-unpacked/codex"
          node scripts/release.mjs verify "$GITHUB_REF_NAME" "$RUNNER_TEMP/agent-kanban-unpacked"

      - name: 上传 Release 附件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            kanban-plugin.zip kanban-codex-plugin.zip \
            || gh release upload "$GITHUB_REF_NAME" kanban-plugin.zip kanban-codex-plugin.zip --clobber
