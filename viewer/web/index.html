<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看板</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; color: #1f2328; background: #f6f8fa; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: #fff; border-bottom: 1px solid #d0d7de; position: sticky; top: 0; flex-wrap: wrap; }
  header .title { font-weight: 600; }
  select, button { font-size: 13px; padding: 4px 10px; }
  select { max-width: 40vw; }
  button { cursor: pointer; border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 6px; }
  button:hover { background: #eaeef2; }
  button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  button.danger { color: #cf222e; border-color: #cf222e; }
  .tabs { display: flex; gap: 4px; }
  .tabs button.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  main { padding: 20px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid #d0d7de; padding: 6px 10px; font-size: 13px; text-align: left; }
  th { background: #f6f8fa; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f0f6ff; }
  .badge-active { display: inline-block; background: #1a7f37; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 12px; margin-left: 6px; }
  .badge-error { color: #cf222e; font-size: 12px; }
  .empty { color: #57606a; padding: 40px 0; text-align: center; }
  .hint { color: #57606a; font-size: 13px; margin: 8px 0; }
  .board { display: flex; gap: 12px; align-items: flex-start; }
  .board-col { flex: 1; background: #eaeef2; border-radius: 8px; padding: 8px; min-height: 200px; }
  .board-col.drag-over { outline: 2px dashed #1f6feb; background: #ddf0ff; }
  .board-col h3 { margin: 4px 6px 10px; font-size: 14px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: grab; font-size: 13px; }
  .card .card-id { color: #57606a; font-size: 12px; }
  .card .card-goal { color: #57606a; font-size: 12px; margin-top: 4px; }
  .section-body { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 12px; font-size: 13px; line-height: 1.6; margin: 6px 0 16px; word-break: break-word; }
  .section-body.editable { cursor: text; }
  .section-body.editable:hover { border-color: #1f6feb; }
  .md-preview > :first-child { margin-top: 0; }
  .md-preview > :last-child { margin-bottom: 0; }
  .md-preview h1, .md-preview h2, .md-preview h3, .md-preview h4 { margin: 12px 0 6px; line-height: 1.4; }
  .md-preview h1 { font-size: 18px; } .md-preview h2 { font-size: 16px; } .md-preview h3 { font-size: 14px; }
  .md-preview p, .md-preview ul, .md-preview ol, .md-preview blockquote, .md-preview table, .md-preview pre { margin: 6px 0; }
  .md-preview ul, .md-preview ol { padding-left: 22px; }
  .md-preview blockquote { border-left: 3px solid #d0d7de; color: #57606a; padding: 2px 10px; }
  .md-preview code { background: #eff1f3; border-radius: 4px; padding: 1px 5px; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  .md-preview pre code { display: block; padding: 8px 10px; overflow: auto; }
  .md-preview a { color: #1f6feb; }
  .md-preview img { max-width: 100%; }
  .md-preview input[type="checkbox"] { width: auto; margin: 0 4px 0 0; vertical-align: middle; }
  .md-preview table { display: block; overflow: auto; }
  .md-preview--empty { color: #57606a; }
  .md-preview--error { border-color: #cf222e; }
  .md-preview-error { color: #cf222e; font-size: 12px; margin-bottom: 6px; }
  .md-preview-source { white-space: pre-wrap; margin: 0; font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
  .section-split { display: flex; gap: 12px; align-items: flex-start; margin: 6px 0; }
  .section-split .md-live { flex: 1; margin: 0; }
  .section-split .section-preview { flex: 1; max-height: 50vh; overflow: auto; }
  @media (max-width: 900px) {
    .section-split { flex-direction: column; }
    .section-split .md-live, .section-split .section-preview { width: 100%; }
  }
  .section-head { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .section-head h3 { margin: 0; font-size: 14px; }
  /* 共享 Markdown Live Preview 编辑器（CodeMirror） */
  .md-live { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; margin: 6px 0; max-width: 100%; box-sizing: border-box; }
  .md-live-bar { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-bottom: 1px solid #eaeef2; }
  .md-live-mode { font-size: 12px; padding: 2px 8px; }
  .md-live-error { color: #cf222e; font-size: 12px; }
  .md-live-host .cm-editor { min-height: 140px; font-size: 13px; border-radius: 0 0 6px 6px; }
  .md-live-host .cm-editor.cm-focused { outline: none; }
  .md-live-host .cm-scroller { line-height: 1.6; font-family: inherit; }
  .md-live[data-mode="source"] .cm-content { font-family: ui-monospace, Consolas, monospace; }
  .note-live .md-live-host .cm-editor { min-height: 200px; }
  .goal-editor .md-live-host .cm-editor { min-height: 96px; }
  /* 非活动区块渲染 widget 的排版（HTML 均经 renderMarkdown 清理） */
  /* .cm-line 的 pre-wrap 会让 marked HTML 标签间的空白文本渲染成行盒，widget 内恢复 normal */
  .md-live-block { padding: 1px 0; word-break: break-word; white-space: normal; }
  .md-live-block pre, .md-live-block pre code { white-space: pre; }
  .md-live-block > :first-child { margin-top: 2px; }
  .md-live-block > :last-child { margin-bottom: 2px; }
  .md-live-block h1, .md-live-block h2 { font-size: 17px; margin: 10px 0 6px; line-height: 1.4; }
  .md-live-block h3, .md-live-block h4 { font-size: 14px; margin: 8px 0 4px; line-height: 1.4; }
  .md-live-block p, .md-live-block ul, .md-live-block ol, .md-live-block blockquote, .md-live-block table, .md-live-block pre { margin: 4px 0; }
  .md-live-block ul, .md-live-block ol { padding-left: 22px; }
  .md-live-block blockquote { border-left: 3px solid #d0d7de; color: #57606a; padding: 2px 10px; }
  .md-live-block code { background: #eff1f3; border-radius: 4px; padding: 1px 5px; font-size: 12px; font-family: ui-monospace, Consolas, monospace; }
  .md-live-block pre code { display: block; padding: 8px 10px; overflow: auto; }
  .md-live-block a { color: #1f6feb; }
  .md-live-block img { max-width: 100%; }
  .md-live-block input[type="checkbox"] { width: auto; margin: 0 4px 0 0; padding: 0; vertical-align: middle; }
  .md-live-block table { display: block; overflow: auto; }
  .sync-status { font-size: 12px; color: #57606a; }
  .sync-status[data-status="dirty"] { color: #9a6700; }
  .sync-status[data-status="saving"] { color: #57606a; }
  .sync-status[data-status="saved"] { color: #1a7f37; }
  .sync-status[data-status="error"], .sync-status[data-status="conflict"] { color: #cf222e; }
  .conflict-remote { border-color: #cf222e; }
  .conflict-col-title { font-size: 12px; color: #cf222e; margin-bottom: 4px; }
  .conflict-actions { margin: 6px 0 16px; }
  .banner-409 { background: #fff8c5; border: 1px solid #d4a72c; border-radius: 6px; padding: 10px 14px; margin: 10px 0; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .detail-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .detail-head h2 { margin: 0; font-size: 18px; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; }
  .modal { background: #fff; border-radius: 8px; padding: 20px; width: 420px; max-width: 90vw; }
  .modal--wide { width: 640px; }
  .modal h3 { margin-top: 0; }
  .modal label { display: block; font-size: 13px; margin: 10px 0 4px; }
  .modal input:not([type="checkbox"]) { width: 100%; padding: 6px 8px; font-size: 13px; box-sizing: border-box; }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal .modal-error { color: #cf222e; font-size: 13px; margin-top: 8px; }
  .p4-file-list { margin: 8px 0; padding-left: 20px; font-size: 13px; max-height: 30vh; overflow: auto; }
  .p4-file-list li { margin: 2px 0; }
  .proj-section { margin-top: 14px; }
  .proj-section h4 { margin: 0 0 4px; font-size: 14px; }
  .proj-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; font-size: 13px; }
  .proj-row .proj-root { flex: 1; word-break: break-all; }
  .proj-add-input { flex: 1; padding: 6px 8px; font-size: 13px; box-sizing: border-box; }
  .dep-graph-wrap { overflow: auto; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; max-height: calc(100vh - 140px); }
  .dep-node { cursor: grab; }
  .dep-node .dep-handle { opacity: 0; fill: #1f6feb; stroke: #fff; stroke-width: 2; cursor: crosshair; }
  .dep-node:hover .dep-handle { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
