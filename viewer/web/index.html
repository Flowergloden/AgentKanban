<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看板</title>
<style>
  body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; color: #1f2328; background: #f6f8fa; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: #fff; border-bottom: 1px solid #d0d7de; position: sticky; top: 0; flex-wrap: wrap; }
  header .title { font-weight: 600; }
  select, button { font-size: 13px; padding: 4px 10px; }
  select { max-width: 40vw; }
  button { cursor: pointer; border: 1px solid #d0d7de; background: #f6f8fa; border-radius: 6px; }
  button:hover { background: #eaeef2; }
  button.primary { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  button.danger { color: #cf222e; border-color: #cf222e; }
  .tabs { display: flex; gap: 4px; }
  .tabs button.active { background: #1f6feb; color: #fff; border-color: #1f6feb; }
  main { padding: 20px; }
  table { border-collapse: collapse; width: 100%; background: #fff; }
  th, td { border: 1px solid #d0d7de; padding: 6px 10px; font-size: 13px; text-align: left; }
  th { background: #f6f8fa; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #f0f6ff; }
  .badge-active { display: inline-block; background: #1a7f37; color: #fff; border-radius: 10px; padding: 1px 8px; font-size: 12px; margin-left: 6px; }
  .badge-error { color: #cf222e; font-size: 12px; }
  .empty { color: #57606a; padding: 40px 0; text-align: center; }
  .hint { color: #57606a; font-size: 13px; margin: 8px 0; }
  .board { display: flex; gap: 12px; align-items: flex-start; }
  .board-col { flex: 1; background: #eaeef2; border-radius: 8px; padding: 8px; min-height: 200px; }
  .board-col.drag-over { outline: 2px dashed #1f6feb; background: #ddf0ff; }
  .board-col h3 { margin: 4px 6px 10px; font-size: 14px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; cursor: grab; font-size: 13px; }
  .card .card-id { color: #57606a; font-size: 12px; }
  .card .card-goal { color: #57606a; font-size: 12px; margin-top: 4px; }
  pre.section-body { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 12px; white-space: pre-wrap; word-break: break-word; font-size: 13px; line-height: 1.6; margin: 6px 0 16px; }
  pre.section-body.editable { cursor: text; }
  pre.section-body.editable:hover { border-color: #1f6feb; }
  textarea.section-editor { width: 100%; min-height: 140px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; padding: 8px; box-sizing: border-box; margin: 6px 0; }
  .section-head { display: flex; align-items: center; gap: 8px; margin-top: 16px; }
  .section-head h3 { margin: 0; font-size: 14px; }
  .banner-409 { background: #fff8c5; border: 1px solid #d4a72c; border-radius: 6px; padding: 10px 14px; margin: 10px 0; font-size: 13px; display: flex; align-items: center; gap: 10px; }
  .detail-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 8px; }
  .detail-head h2 { margin: 0; font-size: 18px; }
  .modal-mask { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; }
  .modal { background: #fff; border-radius: 8px; padding: 20px; width: 420px; max-width: 90vw; }
  .modal--wide { width: 640px; }
  textarea.note-editor { width: 100%; min-height: 320px; font-size: 13px; line-height: 1.6; padding: 8px; box-sizing: border-box; margin: 10px 0 4px; resize: vertical; }
  .modal h3 { margin-top: 0; }
  .modal label { display: block; font-size: 13px; margin: 10px 0 4px; }
  .modal input { width: 100%; padding: 6px 8px; font-size: 13px; box-sizing: border-box; }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .modal .modal-error { color: #cf222e; font-size: 13px; margin-top: 8px; }
  .p4-file-list { margin: 8px 0; padding-left: 20px; font-size: 13px; max-height: 30vh; overflow: auto; }
  .p4-file-list li { margin: 2px 0; }
  .dep-graph-wrap { overflow: auto; background: #fff; border: 1px solid #d0d7de; border-radius: 8px; max-height: calc(100vh - 140px); }
  .dep-node { cursor: grab; }
  .dep-node .dep-handle { opacity: 0; fill: #1f6feb; stroke: #fff; stroke-width: 2; cursor: crosshair; }
  .dep-node:hover .dep-handle { opacity: 1; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
